<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Understory — Plant Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1f3524;
    --forest-dark:#152318;
    --cream:#f4f1e6;
    --terracotta:#bd5b34;
    --moss:#8a9a6e;
    --gold:#d9b25a;
    --line: rgba(31,53,36,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--forest-dark);font-family:'DM Sans',sans-serif;}

  /* ---- Top bar ---- */
  #topbar{
    background:var(--forest); color:var(--cream); padding:16px 28px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:50;
  }
  #logo{font-family:'Newsreader',serif; font-style:italic; font-weight:600; font-size:22px;}
  #cart-btn{
    background:var(--terracotta); color:var(--cream); border:none; padding:9px 16px; border-radius:20px;
    font-family:'DM Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  #cart-btn:hover{background:#d3703f;}
  #cart-count{background:var(--cream); color:var(--forest); border-radius:50%; width:20px; height:20px; font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:700;}

  #hero{padding:34px 28px 20px 28px; max-width:1200px; margin:0 auto;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--moss); margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .eyebrow::after{content:'';flex:1;height:1px;background:var(--line);}
  h1{font-family:'Newsreader',serif; font-weight:600; font-size:34px; margin:0 0 6px 0; color:var(--forest-dark);}
  #hero-sub{font-size:14px; color:rgba(31,53,36,0.65); max-width:520px; line-height:1.55; margin:0;}

  #layout{max-width:1200px; margin:0 auto; display:flex; gap:26px; padding:10px 28px 60px 28px; align-items:flex-start;}

  /* ---- Filters sidebar ---- */
  #filters{width:220px; min-width:220px; position:sticky; top:80px;}
  .filter-group{margin-bottom:22px;}
  .filter-title{
    font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--forest); opacity:0.6; margin-bottom:10px;
  }
  .filter-opt{
    display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px; cursor:pointer; color:var(--forest-dark);
  }
  .filter-opt input{accent-color:var(--terracotta); width:15px; height:15px;}
  #clear-filters{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--terracotta); background:none; border:none;
    cursor:pointer; padding:0; text-decoration:underline; margin-top:4px;
  }

  /* ---- Product grid ---- */
  #catalog{flex:1;}
  #result-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  #result-count{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:rgba(31,53,36,0.55);}
  #sort-select{
    font-family:'DM Sans',sans-serif; font-size:12.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--cream); color:var(--forest-dark);
  }

  #grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:18px;}
  .product-card{
    background:#fff; border-radius:12px; overflow:hidden; border:1px solid var(--line);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .product-card:hover{box-shadow:0 12px 26px rgba(31,53,36,0.14); transform:translateY(-2px);}
  .product-swatch{
    aspect-ratio:1; position:relative; display:flex; align-items:center; justify-content:center;
  }
  .pot{
    width:52%; height:38%; position:absolute; bottom:14%; border-radius:2px 2px 10px 10px;
  }
  .plant-badge{
    position:absolute; top:10px; left:10px; background:rgba(255,255,255,0.85); color:var(--forest-dark);
    font-family:'JetBrains Mono',monospace; font-size:9.5px; text-transform:uppercase; padding:3px 7px; border-radius:4px;
    letter-spacing:0.03em;
  }
  .product-info{padding:14px;}
  .product-name{font-family:'Newsreader',serif; font-weight:600; font-size:16px; margin-bottom:3px;}
  .product-specs{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px 0;}
  .spec-chip{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; text-transform:uppercase; background:rgba(31,53,36,0.06);
    padding:3px 7px; border-radius:4px; color:var(--forest);
  }
  .product-bottom{display:flex; align-items:center; justify-content:space-between;}
  .product-price{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px; color:var(--terracotta);}
  .add-btn{
    background:var(--forest); color:var(--cream); border:none; border-radius:6px; padding:6px 12px;
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .add-btn:hover{background:var(--terracotta);}
  #no-results{grid-column:1/-1; text-align:center; padding:50px 0; color:rgba(31,53,36,0.45); font-size:14px;}

  /* ---- Cart drawer ---- */
  #overlay{position:fixed; inset:0; background:rgba(21,35,24,0.45); display:none; z-index:90;}
  #overlay.open{display:block;}
  #cart-drawer{
    position:fixed; top:0; right:-400px; width:380px; height:100%; background:var(--cream); z-index:100;
    box-shadow:-10px 0 30px rgba(0,0,0,0.2); transition:right .25s ease; display:flex; flex-direction:column;
  }
  #cart-drawer.open{right:0;}
  #cart-header{padding:22px 22px 14px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  #cart-header h2{font-family:'Newsreader',serif; font-weight:600; font-size:20px; margin:0;}
  #cart-close{background:none; border:1.5px solid var(--line); border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:14px;}
  #cart-items{flex:1; overflow-y:auto; padding:14px 22px;}
  .cart-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:center;}
  .cart-swatch{width:52px; height:52px; border-radius:8px; flex-shrink:0;}
  .cart-name{font-family:'Newsreader',serif; font-weight:600; font-size:14px;}
  .cart-price{font-family:'JetBrains Mono',monospace; font-size:12px; color:rgba(31,53,36,0.55);}
  .qty-row{display:flex; align-items:center; gap:8px; margin-top:4px;}
  .qty-btn{width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12px;}
  .qty-val{font-family:'JetBrains Mono',monospace; font-size:12.5px; min-width:16px; text-align:center;}
  .remove-btn{margin-left:auto; background:none; border:none; color:rgba(31,53,36,0.4); cursor:pointer; font-size:12px; text-decoration:underline;}
  #empty-cart{text-align:center; color:rgba(31,53,36,0.4); padding:40px 0; font-size:13.5px;}
  #cart-footer{padding:18px 22px 22px 22px; border-top:1px solid var(--line);}
  #cart-total-row{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:14px; margin-bottom:14px; font-weight:600;}
  #checkout-btn{width:100%; background:var(--forest); color:var(--cream); border:none; padding:13px; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer;}
  #checkout-btn:hover{background:var(--terracotta);}

  @media(max-width:760px){
    #layout{flex-direction:column;}
    #filters{width:100%; position:static; display:flex; gap:24px; flex-wrap:wrap;}
    #cart-drawer{width:100%; right:-100%;}
  }
</style>
</head>
<body>
<div id="topbar">
  <div id="logo">Understory</div>
  <button id="cart-btn">Cart <span id="cart-count">0</span></button>
</div>

<div id="hero">
  <div class="eyebrow">The Catalog</div>
  <h1>Houseplants, sorted<br/>by how much light you've got.</h1>
  <p id="hero-sub">Filter by the conditions in your space, not just the plant's name. Everything here ships bare-root or in nursery pots — planters sold separately.</p>
</div>

<div id="layout">
  <div id="filters">
    <div class="filter-group">
      <div class="filter-title">Light needed</div>
      <label class="filter-opt"><input type="checkbox" data-filter="light" value="low"> Low light</label>
      <label class="filter-opt"><input type="checkbox" data-filter="light" value="medium"> Medium light</label>
      <label class="filter-opt"><input type="checkbox" data-filter="light" value="bright"> Bright light</label>
    </div>
    <div class="filter-group">
      <div class="filter-title">Care level</div>
      <label class="filter-opt"><input type="checkbox" data-filter="care" value="easy"> Easy</label>
      <label class="filter-opt"><input type="checkbox" data-filter="care" value="moderate"> Moderate</label>
      <label class="filter-opt"><input type="checkbox" data-filter="care" value="fussy"> Fussy</label>
    </div>
    <div class="filter-group">
      <div class="filter-title">Other</div>
      <label class="filter-opt"><input type="checkbox" data-filter="tag" value="pet-safe"> Pet-safe</label>
      <label class="filter-opt"><input type="checkbox" data-filter="tag" value="air-purifying"> Air-purifying</label>
    </div>
    <button id="clear-filters">Clear all filters</button>
  </div>

  <div id="catalog">
    <div id="result-bar">
      <div id="result-count"></div>
      <select id="sort-select">
        <option value="featured">Sort: Featured</option>
        <option value="price-asc">Price: Low to high</option>
        <option value="price-desc">Price: High to low</option>
        <option value="name">Name: A–Z</option>
      </select>
    </div>
    <div id="grid"></div>
  </div>
</div>

<div id="overlay"></div>
<div id="cart-drawer">
  <div id="cart-header">
    <h2>Your cart</h2>
    <button id="cart-close">✕</button>
  </div>
  <div id="cart-items"></div>
  <div id="cart-footer">
    <div id="cart-total-row"><span>Total</span><span id="cart-total">$0.00</span></div>
    <button id="checkout-btn">Checkout</button>
  </div>
</div>

<script>
const GREENS = ['#3a5a3f','#4c6b3f','#2f4a37','#5a7047','#3d5744'];
const POTS = ['#bd5b34','#a94a2b','#c46f42','#8a4a2f'];

const PRODUCTS = [
  { id:1, name:'Snake Plant', price:28, light:'low', care:'easy', tags:['air-purifying'] },
  { id:2, name:'Pothos, Golden', price:18, light:'low', care:'easy', tags:['air-purifying'] },
  { id:3, name:'ZZ Plant', price:32, light:'low', care:'easy', tags:['air-purifying'] },
  { id:4, name:'Monstera Deliciosa', price:45, light:'medium', care:'easy', tags:['pet-safe'] },
  { id:5, name:'Fiddle Leaf Fig', price:65, light:'bright', care:'moderate', tags:[] },
  { id:6, name:'Calathea Orbifolia', price:38, light:'medium', care:'fussy', tags:['pet-safe'] },
  { id:7, name:'Boston Fern', price:24, light:'medium', care:'moderate', tags:['pet-safe','air-purifying'] },
  { id:8, name:'String of Pearls', price:16, light:'bright', care:'moderate', tags:['pet-safe'] },
  { id:9, name:'Bird of Paradise', price:72, light:'bright', care:'moderate', tags:[] },
  { id:10, name:'Peace Lily', price:26, light:'low', care:'easy', tags:['air-purifying'] },
  { id:11, name:'Maidenhair Fern', price:22, light:'medium', care:'fussy', tags:['pet-safe'] },
  { id:12, name:'Rubber Plant', price:34, light:'medium', care:'easy', tags:['pet-safe'] },
  { id:13, name:'Alocasia Polly', price:29, light:'bright', care:'fussy', tags:[] },
  { id:14, name:'Spider Plant', price:14, light:'low', care:'easy', tags:['pet-safe','air-purifying'] },
  { id:15, name:'Prayer Plant', price:20, light:'medium', care:'moderate', tags:['pet-safe'] },
  { id:16, name:'Areca Palm', price:48, light:'bright', care:'moderate', tags:['pet-safe','air-purifying'] }
];

let activeFilters = { light:new Set(), care:new Set(), tag:new Set() };
let cart = {}; // id -> qty

const gridEl = document.getElementById('grid');
const resultCount = document.getElementById('result-count');
const sortSelect = document.getElementById('sort-select');

function matchesFilters(p){
  if(activeFilters.light.size && !activeFilters.light.has(p.light)) return false;
  if(activeFilters.care.size && !activeFilters.care.has(p.care)) return false;
  if(activeFilters.tag.size && ![...activeFilters.tag].every(t=>p.tags.includes(t))) return false;
  return true;
}

function renderGrid(){
  let list = PRODUCTS.filter(matchesFilters);
  const sort = sortSelect.value;
  if(sort==='price-asc') list.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc') list.sort((a,b)=>b.price-a.price);
  else if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));

  resultCount.textContent = `${list.length} plants`;
  gridEl.innerHTML='';
  if(list.length===0){
    gridEl.innerHTML = '<div id="no-results">No plants match those filters. Try clearing one.</div>';
    return;
  }
  list.forEach((p,i)=>{
    const card = document.createElement('div');
    card.className='product-card';
    const badges = [
      p.light==='low'?'Low light':p.light==='medium'?'Medium light':'Bright light'
    ];
    card.innerHTML = `
      <div class="product-swatch" style="background:linear-gradient(160deg, ${GREENS[i%GREENS.length]}, ${GREENS[(i+2)%GREENS.length]})">
        <span class="plant-badge">${badges[0]}</span>
        <div class="pot" style="background:${POTS[i%POTS.length]}"></div>
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-specs">
          <span class="spec-chip">${p.care}</span>
          ${p.tags.map(t=>`<span class="spec-chip">${t}</span>`).join('')}
        </div>
        <div class="product-bottom">
          <span class="product-price">$${p.price}</span>
          <button class="add-btn" data-id="${p.id}">Add</button>
        </div>
      </div>
    `;
    gridEl.appendChild(card);
  });
  gridEl.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> addToCart(parseInt(btn.dataset.id)));
  });
}

// ---- Filters ----
document.querySelectorAll('input[data-filter]').forEach(input=>{
  input.addEventListener('change', ()=>{
    const group = input.dataset.filter;
    if(input.checked) activeFilters[group].add(input.value);
    else activeFilters[group].delete(input.value);
    renderGrid();
  });
});
document.getElementById('clear-filters').addEventListener('click', ()=>{
  document.querySelectorAll('input[data-filter]').forEach(i=>i.checked=false);
  activeFilters = { light:new Set(), care:new Set(), tag:new Set() };
  renderGrid();
});
sortSelect.addEventListener('change', renderGrid);

// ---- Cart ----
const cartBtn = document.getElementById('cart-btn');
const cartCount = document.getElementById('cart-count');
const cartDrawer = document.getElementById('cart-drawer');
const overlay = document.getElementById('overlay');
const cartItemsEl = document.getElementById('cart-items');
const cartTotalEl = document.getElementById('cart-total');

function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  renderCart();
  openCart();
}
function changeQty(id, delta){
  cart[id] = (cart[id]||0) + delta;
  if(cart[id]<=0) delete cart[id];
  renderCart();
}
function removeFromCart(id){
  delete cart[id];
  renderCart();
}

function renderCart(){
  const ids = Object.keys(cart);
  let totalQty = 0, totalPrice = 0;
  cartItemsEl.innerHTML='';
  if(ids.length===0){
    cartItemsEl.innerHTML = '<div id="empty-cart">Your cart is empty. Add a plant or two.</div>';
  }
  ids.forEach(idStr=>{
    const id = parseInt(idStr);
    const p = PRODUCTS.find(x=>x.id===id);
    const qty = cart[id];
    totalQty += qty;
    totalPrice += qty * p.price;
    const idx = PRODUCTS.indexOf(p);
    const row = document.createElement('div');
    row.className='cart-item';
    row.innerHTML = `
      <div class="cart-swatch" style="background:linear-gradient(160deg, ${GREENS[idx%GREENS.length]}, ${GREENS[(idx+2)%GREENS.length]})"></div>
      <div style="flex:1">
        <div class="cart-name">${p.name}</div>
        <div class="cart-price">$${p.price} each</div>
        <div class="qty-row">
          <button class="qty-btn" data-action="minus" data-id="${id}">−</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn" data-action="plus" data-id="${id}">+</button>
          <button class="remove-btn" data-id="${id}">Remove</button>
        </div>
      </div>
    `;
    cartItemsEl.appendChild(row);
  });
  cartCount.textContent = totalQty;
  cartTotalEl.textContent = '$' + totalPrice.toFixed(2);

  cartItemsEl.querySelectorAll('.qty-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> changeQty(parseInt(btn.dataset.id), btn.dataset.action==='plus'?1:-1));
  });
  cartItemsEl.querySelectorAll('.remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> removeFromCart(parseInt(btn.dataset.id)));
  });
}

function openCart(){ cartDrawer.classList.add('open'); overlay.classList.add('open'); }
function closeCart(){ cartDrawer.classList.remove('open'); overlay.classList.remove('open'); }
cartBtn.addEventListener('click', openCart);
document.getElementById('cart-close').addEventListener('click', closeCart);
overlay.addEventListener('click', closeCart);

renderGrid();
renderCart();
</script>
</body>
</html>
