<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161A;
    --panel: #1C1F26;
    --card-back: #262A33;
    --amber: #E8A94B;
    --teal: #5FBFA6;
    --coral: #E1605A;
    --text: #F2F1EC;
    --dim: #8A8F98;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
  }
  .app{ width:100%; max-width: 440px; }

  .top-bar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 24px;
  }
  .stats{
    display:flex; gap: 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--dim);
  }
  .stats b{ color: var(--amber); }

  .board{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    perspective: 800px;
    margin-bottom: 18px;
  }
  .cell{
    aspect-ratio: 1;
    position: relative;
    cursor:pointer;
  }
  .cell-inner{
    position:absolute; inset:0;
    transform-style: preserve-3d;
    transition: transform 0.4s cubic-bezier(.4,0,.2,1);
  }
  .cell.flipped .cell-inner, .cell.matched .cell-inner{
    transform: rotateY(180deg);
  }
  .face{
    position:absolute; inset:0;
    border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility: hidden;
    font-size: 28px;
  }
  .face-back{
    background: var(--card-back);
    border: 1px solid rgba(242,241,236,0.08);
    color: var(--dim);
    font-family:'IBM Plex Mono', monospace;
    font-size: 16px;
  }
  .face-front{
    background: var(--panel);
    border: 1.5px solid var(--amber);
    transform: rotateY(180deg);
  }
  .cell.matched .face-front{
    border-color: var(--teal);
    background: rgba(95,191,166,0.1);
  }
  .cell.matched .cell-inner{ opacity: 0.55; }

  .cell.shake .cell-inner{ animation: shake 0.4s ease; }
  @keyframes shake{
    20%{ transform: rotateY(180deg) translateX(-5px); }
    40%{ transform: rotateY(180deg) translateX(5px); }
    60%{ transform: rotateY(180deg) translateX(-4px); }
    80%{ transform: rotateY(180deg) translateX(4px); }
    100%{ transform: rotateY(180deg) translateX(0); }
  }

  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 12px 0;
    border-radius: 10px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{ background: var(--amber); color: #14161A; font-weight:600; }
  .btn-secondary{ background: var(--panel); color: var(--text); border: 1px solid rgba(242,241,236,0.1); }

  .win-overlay{
    position:fixed; inset:0;
    background: rgba(20,22,26,0.85);
    display:none;
    align-items:center; justify-content:center;
    z-index: 20;
    padding: 20px;
  }
  .win-overlay.show{ display:flex; }
  .win-card{
    background: var(--panel);
    border-radius: 20px;
    padding: 34px 30px;
    text-align:center;
    max-width: 320px;
  }
  .win-card .emoji{ font-size: 40px; margin-bottom: 10px; }
  .win-card h2{ font-family:'Fraunces', serif; font-size: 22px; margin-bottom: 10px; }
  .win-card p{ color: var(--dim); font-size: 14px; margin-bottom: 22px; }
</style>
</head>
<body>

<div class="app">
  <div class="top-bar">
    <h1>Memory Match</h1>
    <div class="stats">
      <span>Moves: <b id="movesCount">0</b></span>
      <span>Time: <b id="timeCount">0:00</b></span>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="restartBtn">Restart</button>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="emoji">🎉</div>
    <h2>You matched them all!</h2>
    <p id="winStats">0 moves · 0:00</p>
    <button class="btn btn-primary" id="playAgainBtn">Play again</button>
  </div>
</div>

<script>
(function(){
  const icons = ['🍎','🍇','🍋','🍓','🍒','🍍','🥝','🍑'];
  const board = document.getElementById('board');
  const movesCount = document.getElementById('movesCount');
  const timeCount = document.getElementById('timeCount');
  const winOverlay = document.getElementById('winOverlay');
  const winStats = document.getElementById('winStats');

  let cards = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let lockBoard = false;
  let seconds = 0;
  let timerId = null;
  let started = false;

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function fmtTime(s){
    const m = Math.floor(s/60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2,'0');
  }

  function startTimer(){
    if (started) return;
    started = true;
    timerId = setInterval(() => {
      seconds++;
      timeCount.textContent = fmtTime(seconds);
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerId);
  }

  function buildBoard(){
    const deck = shuffle([...icons, ...icons]);
    cards = deck.map((icon, i) => ({ id: i, icon, matched: false }));

    board.innerHTML = '';
    cards.forEach(card => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.id = card.id;
      cell.innerHTML = `
        <div class="cell-inner">
          <div class="face face-back">?</div>
          <div class="face face-front">${card.icon}</div>
        </div>
      `;
      cell.addEventListener('click', () => flipCard(cell, card));
      board.appendChild(cell);
    });
  }

  function flipCard(cell, card){
    if (lockBoard || cell.classList.contains('flipped') || cell.classList.contains('matched')) return;
    startTimer();

    cell.classList.add('flipped');
    flipped.push({ cell, card });

    if (flipped.length === 2){
      moves++;
      movesCount.textContent = moves;
      lockBoard = true;
      checkMatch();
    }
  }

  function checkMatch(){
    const [a, b] = flipped;
    if (a.card.icon === b.card.icon){
      a.cell.classList.add('matched');
      b.cell.classList.add('matched');
      matchedCount += 2;
      flipped = [];
      lockBoard = false;
      if (matchedCount === cards.length) endGame();
    } else {
      a.cell.classList.add('shake');
      b.cell.classList.add('shake');
      setTimeout(() => {
        a.cell.classList.remove('flipped', 'shake');
        b.cell.classList.remove('flipped', 'shake');
        flipped = [];
        lockBoard = false;
      }, 700);
    }
  }

  function endGame(){
    stopTimer();
    setTimeout(() => {
      winStats.textContent = moves + ' moves · ' + fmtTime(seconds);
      winOverlay.classList.add('show');
    }, 500);
  }

  function restart(){
    stopTimer();
    seconds = 0; moves = 0; matchedCount = 0; flipped = []; lockBoard = false; started = false;
    movesCount.textContent = 0;
    timeCount.textContent = '0:00';
    winOverlay.classList.remove('show');
    buildBoard();
  }

  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('playAgainBtn').addEventListener('click', restart);

  buildBoard();
})();
</script>
</body>
</html>
