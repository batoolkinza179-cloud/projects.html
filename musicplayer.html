<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crate — Turntable Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --onyx:#161512;
    --onyx-2:#1e1c18;
    --felt:#232921;
    --brass:#b5793f;
    --brass-bright:#e0a85c;
    --cream:#ece2cc;
    --burgundy:#8a3230;
    --amber:#e8a33d;
    --line: rgba(236,226,204,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Manrope',sans-serif;background:var(--onyx);color:var(--cream);}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden;}

  /* ============ Crate (sidebar) ============ */
  #crate{
    width:360px; min-width:360px; background:var(--onyx-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #crate-header{padding:26px 22px 16px 22px; border-bottom:1px solid var(--line);}
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--brass-bright); display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:14px;height:1px;background:var(--brass-bright);}
  h1{font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:30px; margin:0 0 4px 0; color:var(--cream);}
  .sub{font-size:12.5px; color:rgba(236,226,204,0.5); margin:0; line-height:1.5;}

  #load-zone{
    margin:16px 22px; padding:14px; border:1.5px dashed rgba(181,121,63,0.5); border-radius:8px;
    text-align:center; cursor:pointer; transition:all .15s ease;
  }
  #load-zone:hover, #load-zone.dragover{border-color:var(--brass-bright); background:rgba(181,121,63,0.08);}
  #load-zone-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.04em; color:var(--brass-bright); text-transform:uppercase;}
  #load-zone-sub{font-size:11px; color:rgba(236,226,204,0.4); margin-top:4px;}
  #file-input{display:none;}

  #track-list{flex:1; overflow-y:auto; padding:6px 12px 20px 12px;}
  #track-list::-webkit-scrollbar{width:7px;}
  #track-list::-webkit-scrollbar-thumb{background:rgba(236,226,204,0.15); border-radius:4px;}

  .track-row{
    display:flex; align-items:center; gap:12px; padding:10px 10px; border-radius:8px; cursor:pointer;
    border:1px solid transparent;
  }
  .track-row:hover{background:rgba(236,226,204,0.05);}
  .track-row.active{background:rgba(181,121,63,0.16); border-color:rgba(181,121,63,0.4);}
  .track-swatch{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; position:relative;
    background:conic-gradient(from 0deg, rgba(0,0,0,0.35), transparent 20%, rgba(0,0,0,0.35) 40%, transparent 60%, rgba(0,0,0,0.35) 80%);
  }
  .track-swatch::after{content:'';position:absolute; inset:38%; border-radius:50%; background:var(--onyx-2);}
  .track-title{font-size:13.5px; font-weight:600; color:var(--cream); line-height:1.3;}
  .track-artist{font-size:11.5px; color:rgba(236,226,204,0.45);}
  .track-dur{
    margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(236,226,204,0.4);
  }
  #empty-crate{padding:30px 14px; text-align:center; color:rgba(236,226,204,0.4); font-size:12.5px; line-height:1.6;}

  /* ============ Player (main) ============ */
  #player{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding:30px;
    background:
      radial-gradient(circle at 50% 30%, rgba(181,121,63,0.06), transparent 60%),
      var(--onyx);
  }

  #turntable-rig{position:relative; width:420px; height:420px; display:flex; align-items:center; justify-content:center;}

  #plinth{
    width:400px; height:400px; border-radius:16px; background:var(--felt);
    box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(236,226,204,0.06);
    display:flex; align-items:center; justify-content:center; position:relative;
  }

  #platter{
    width:300px; height:300px; border-radius:50%;
    background:
      repeating-radial-gradient(circle, #0c0b0a 0px, #0c0b0a 2px, #151412 3px, #151412 4px);
    box-shadow:0 8px 20px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    animation: spin 3.2s linear infinite;
    animation-play-state: paused;
  }
  #platter.spinning{animation-play-state running;}

  #label{
    width:120px; height:120px; border-radius:50%; background:var(--brass);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:10px; position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.2);
  }
  #label::after{content:'';position:absolute; width:8px; height:8px; border-radius:50%; background:var(--onyx);}
  #label-title{font-family:'Instrument Serif',serif; font-style:italic; font-size:13px; color:var(--onyx); line-height:1.15; max-width:100px; overflow:hidden;}
  #label-artist{font-family:'JetBrains Mono',monospace; font-size:8.5px; color:rgba(22,21,18,0.65); margin-top:4px; text-transform:uppercase;}

  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  #tonearm-pivot{
    position:absolute; top:24px; right:24px; width:16px; height:16px; border-radius:50%;
    background:var(--brass); box-shadow:0 2px 6px rgba(0,0,0,0.5); z-index:5;
  }
  #tonearm{
    position:absolute; top:30px; right:30px; width:8px; height:180px;
    background:linear-gradient(to bottom, var(--brass-bright), var(--brass));
    border-radius:4px; transform-origin:top center; transform:rotate(-32deg);
    transition:transform 0.6s cubic-bezier(.4,0,.2,1);
    box-shadow:0 3px 8px rgba(0,0,0,0.4); z-index:4;
  }
  #tonearm::after{
    content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
    width:18px; height:12px; border-radius:3px; background:var(--onyx-2); border:1px solid rgba(236,226,204,0.15);
  }
  #tonearm.playing{transform:rotate(8deg);}

  /* ============ Now playing info ============ */
  #now-playing{text-align:center; margin-top:26px; min-height:52px;}
  #np-title{font-family:'Instrument Serif',serif; font-style:italic; font-size:24px; color:var(--cream); margin:0;}
  #np-artist{font-size:12.5px; color:rgba(236,226,204,0.5); margin-top:2px;}

  /* ============ VU meter ============ */
  #vu-wrap{display:flex; gap:3px; align-items:flex-end; height:28px; margin:14px 0 6px 0;}
  .vu-bar{width:4px; background:var(--amber); border-radius:2px; height:3px; transition:height .05s linear;}

  /* ============ Transport controls ============ */
  #transport{display:flex; align-items:center; gap:18px; margin-top:10px;}
  .ctrl-btn{
    background:none; border:none; cursor:pointer; color:var(--cream); opacity:0.75;
    display:flex; align-items:center; justify-content:center; transition:opacity .15s ease;
  }
  .ctrl-btn:hover{opacity:1;}
  #play-btn{
    width:56px; height:56px; border-radius:50%; background:var(--brass); color:var(--onyx);
    opacity:1; box-shadow:0 6px 16px rgba(181,121,63,0.35);
  }
  #play-btn:hover{background:var(--brass-bright);}

  /* ============ Scrub + volume ============ */
  #seek-row{display:flex; align-items:center; gap:10px; width:420px; margin-top:18px;}
  .time-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:rgba(236,226,204,0.45); width:36px; text-align:center;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:3px; background:rgba(236,226,204,0.15);
    border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--brass-bright); cursor:pointer;
    box-shadow:0 0 0 3px rgba(224,168,92,0.2);
  }
  #volume-row{display:flex; align-items:center; gap:8px; margin-top:14px; width:160px;}
  #volume-row input[type=range]{flex:1;}
  .vol-icon{font-size:13px; color:rgba(236,226,204,0.5);}

  audio{display:none;}

  @media(max-width:900px){
    #crate{width:280px; min-width:280px;}
    #turntable-rig{width:320px; height:320px;}
    #plinth{width:300px; height:300px;}
    #platter{width:220px; height:220px;}
    #seek-row{width:300px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="crate">
    <div id="crate-header">
      <div class="eyebrow">The Crate</div>
      <h1>Turntable</h1>
      <p class="sub">Load your own tracks from your device and drop the needle. Nothing is uploaded anywhere — it all plays locally in this tab.</p>
    </div>
    <div id="load-zone">
      <div id="load-zone-label">＋ Load tracks</div>
      <div id="load-zone-sub">click to browse, or drag audio files here</div>
    </div>
    <input id="file-input" type="file" accept="audio/*" multiple />
    <div id="track-list"></div>
  </div>

  <div id="player">
    <div id="turntable-rig">
      <div id="plinth">
        <div id="platter">
          <div id="label">
            <div id="label-title">No track loaded</div>
            <div id="label-artist">—</div>
          </div>
        </div>
        <div id="tonearm-pivot"></div>
        <div id="tonearm"></div>
      </div>
    </div>

    <div id="now-playing">
      <p id="np-title">Load a track to begin</p>
      <div id="np-artist">Your crate is empty</div>
    </div>

    <div id="vu-wrap"></div>

    <div id="seek-row">
      <span class="time-label" id="time-current">0:00</span>
      <input type="range" id="seek-bar" min="0" max="100" value="0" />
      <span class="time-label" id="time-duration">0:00</span>
    </div>

    <div id="transport">
      <button class="ctrl-btn" id="prev-btn" aria-label="Previous">⏮</button>
      <button class="ctrl-btn" id="play-btn" aria-label="Play">▶</button>
      <button class="ctrl-btn" id="next-btn" aria-label="Next">⏭</button>
    </div>

    <div id="volume-row">
      <span class="vol-icon">🔈</span>
      <input type="range" id="volume-bar" min="0" max="100" value="80" />
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const BRASS_HUES = ['#b5793f','#8a3230','#5c6e46','#4a5a73','#7a5c8a'];

let crate = [];
let currentIndex = -1;
let isPlaying = false;

const audio = document.getElementById('audio');
const fileInput = document.getElementById('file-input');
const loadZone = document.getElementById('load-zone');
const trackListEl = document.getElementById('track-list');
const platter = document.getElementById('platter');
const tonearm = document.getElementById('tonearm');
const labelArtist = document.getElementById('label-artist');
const npTitle = document.getElementById('np-title');
const npArtist = document.getElementById('np-artist');
const playBtn = document.getElementById('play-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const seekBar = document.getElementById('seek-bar');
const volBar = document.getElementById('volume-bar');
const timeCurrent = document.getElementById('time-current');
const timeDuration = document.getElementById('time-duration');
const vuWrap = document.getElementById('vu-wrap');

audio.volume = 0.8;

// ---- VU meter bars ----
const NUM_BARS = 28;
for(let i=0;i<NUM_BARS;i++){
  const bar = document.createElement('div');
  bar.className='vu-bar';
  vuWrap.appendChild(bar);
}
const vuBars = document.querySelectorAll('.vu-bar');

// ---- Web Audio analyser ----
let audioCtx, analyser, sourceNode, dataArray;
function setupAnalyser(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  sourceNode = audioCtx.createMediaElementSource(audio);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

function animateVU(){
  requestAnimationFrame(animateVU);
  if(!analyser || !isPlaying){
    vuBars.forEach(b=> b.style.height = '3px');
    return;
  }
  analyser.getByteFrequencyData(dataArray);
  vuBars.forEach((b,i)=>{
    const v = dataArray[i % dataArray.length];
    b.style.height = Math.max(3, (v/255)*28) + 'px';
  });
}
animateVU();

// ---- File loading ----
function formatTime(sec){
  if(!isFinite(sec)) return '0:00';
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function addFiles(files){
  [...files].forEach(file=>{
    if(!file.type.startsWith('audio/')) return;
    const url = URL.createObjectURL(file);
    const name = file.name.replace(/\.[^/.]+$/, '');
    crate.push({ title: name, artist:'Local file', url, color: BRASS_HUES[crate.length % BRASS_HUES.length] });
  });
  renderCrate();
  if(currentIndex === -1 && crate.length>0){
    loadTrack(0);
  }
}

loadZone.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', e=> addFiles(e.target.files));
['dragover'].forEach(evt=> loadZone.addEventListener(evt, e=>{ e.preventDefault(); loadZone.classList.add('dragover'); }));
['dragleave','drop'].forEach(evt=> loadZone.addEventListener(evt, e=>{ e.preventDefault(); loadZone.classList.remove('dragover'); }));
loadZone.addEventListener('drop', e=>{ addFiles(e.dataTransfer.files); });

function renderCrate(){
  trackListEl.innerHTML='';
  if(crate.length===0){
    trackListEl.innerHTML = '<div id="empty-crate">Nothing in the crate yet.<br/>Load a few tracks above to start spinning.</div>';
    return;
  }
  crate.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'track-row' + (i===currentIndex ? ' active' : '');
    row.innerHTML = `
      <div class="track-swatch" style="background-color:${t.color}"></div>
      <div>
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="track-dur" data-idx="${i}">--:--</div>
    `;
    row.addEventListener('click', ()=> loadTrack(i, true));
    trackListEl.appendChild(row);
  });
}

function loadTrack(i, autoplay){
  currentIndex = i;
  const t = crate[i];
  audio.src = t.url;
  document.getElementById('label-title').textContent = t.title.length>16 ? t.title.slice(0,16)+'…' : t.title;
  labelArtist.textContent = t.artist;
  npTitle.textContent = t.title;
  npArtist.textContent = t.artist;
  document.getElementById('label').style.background = t.color;
  renderCrate();
  if(autoplay !== false){
    play();
  } else {
    pause();
  }
}

function play(){
  if(currentIndex===-1) return;
  setupAnalyser();
  if(audioCtx.state==='suspended') audioCtx.resume();
  audio.play();
  isPlaying = true;
  platter.classList.add('spinning');
  tonearm.classList.add('playing');
  playBtn.textContent = '⏸';
}
function pause(){
  audio.pause();
  isPlaying = false;
  platter.classList.remove('spinning');
  tonearm.classList.remove('playing');
  playBtn.textContent = '▶';
}

playBtn.addEventListener('click', ()=>{
  if(currentIndex===-1){ fileInput.click(); return; }
  isPlaying ? pause() : play();
});
prevBtn.addEventListener('click', ()=>{
  if(crate.length===0) return;
  const newIdx = (currentIndex-1+crate.length)%crate.length;
  loadTrack(newIdx, true);
});
nextBtn.addEventListener('click', ()=>{
  if(crate.length===0) return;
  const newIdx = (currentIndex+1)%crate.length;
  loadTrack(newIdx, true);
});
audio.addEventListener('ended', ()=>{
  if(crate.length===0) return;
  nextBtn.click();
});

audio.addEventListener('loadedmetadata', ()=>{
  seekBar.max = audio.duration;
  timeDuration.textContent = formatTime(audio.duration);
  const durEl = document.querySelector(`.track-dur[data-idx="${currentIndex}"]`);
  if(durEl) durEl.textContent = formatTime(audio.duration);
});
audio.addEventListener('timeupdate', ()=>{
  if(!seekBar.matches(':active')){
    seekBar.value = audio.currentTime;
  }
  timeCurrent.textContent = formatTime(audio.currentTime);
});
seekBar.addEventListener('input', ()=>{
  audio.currentTime = seekBar.value;
});
volBar.addEventListener('input', ()=>{
  audio.volume = volBar.value/100;
});

renderCrate();
</script>
</body>
</html>
